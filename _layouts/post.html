---
layout: default
---
<article class="article">
  <p class="muted">{{ page.date | date: '%Y-%m-%d' }}{% if page.categories %} · {{ page.categories | join: ' / ' }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.tags %}
  <p class="muted">{% for tag in page.tags %}<span class="badge">{{ tag }}</span>{% endfor %}</p>
  {% endif %}
  {{ content }}
</article>
